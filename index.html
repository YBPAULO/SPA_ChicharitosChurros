<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicharitos Artisanal Churros</title>

  <!-- Google Fonts: Epilogue & Literata -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header Fixo -->
    <header class="app-header">
      <div class="header-content">
        <a href="#/" class="brand-logo">
          <span class="material-symbols-outlined logo-icon">bakery_dining</span>
          <div class="brand-titles">
            <span class="brand-name">Chicharitos</span>
            <span class="brand-tagline">Artisanal Churros</span>
          </div>
        </a>
        <a href="#/cart" class="header-cart-btn" id="headerCartBtn" aria-label="Carrinho de Compras">
          <span class="material-symbols-outlined">shopping_bag</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>
    </header>

    <!-- Main View (Renderizado dinamicamente via Hash Router) -->
    <main id="mainContent" class="main-content"></main>

    <!-- Modal de Opcionais de Produto -->
    <div id="productModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="closeModalBtn" class="modal-close-btn" aria-label="Fechar">
          <span class="material-symbols-outlined">close</span>
        </button>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
